description: Superset is a cross-chain stablecoin liquidity protocol that pools liquidity from per-chain singleton vaults into shared virtual pools, with pricing and swap execution on a hub chain. Its pool manager contracts are deployed on chains including Arbitrum, Base and Unichain.
