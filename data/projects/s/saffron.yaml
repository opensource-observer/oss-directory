version: 7
name: saffron
display_name: saffron.finance
description: |-
  Saffron splits the fees earned by a Uniswap position into an upfront premium payment and a variable yield token. The upfront premium can be expressed as an annualized fixed rate. The yield token holder earns all yield from the deposited Uniswap position. Saffron vaults facilitiate this fee splitting mechanism.

  Saffron vaults are permissionless, immutable, and non-upgradable.
