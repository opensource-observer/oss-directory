version: 7
name: x-ray-web3
display_name: X-RAY
description: X-RAY maps the Web3 market as a board of players (companies, protocols, exchanges, funds, chains and DAOs) with who controls them, what capital they hold, their licences and sanctions, and their moves. Its open readers parse public crypto registers (Korea's KoFIU, Japan's FSA, Lido's node operators) and publish register samples under CC BY 4.0.
