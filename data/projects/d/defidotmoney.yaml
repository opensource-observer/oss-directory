version: 7
name: defidotmoney
display_name: defi.money
description:
  defi.money is a collateralised debt protocol issuing MONEY, an overcollateralised
  stablecoin, against blue-chip assets on Arbitrum, Base and Optimism.
  Borrowing uses a soft-liquidation AMM per market, and sMONEY distributes protocol
  revenue to stakers.
