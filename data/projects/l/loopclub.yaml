description: Loopclub (loopclub.xyz) is a real-time collaborative music platform - an onchain drum machine where multiple musicians build step-sequencer loops together in a shared browser session. Each cell a contributor lights up can be claimed on-chain as an NFT, with claims paid for in MegaUSD (USDM).
