description:
  LSP Finance is a liquid staking protocol that issues yield-bearing and principal token
  pairs for non-EVM assets, including MANTA, ALEO and BNB, on Arbitrum One.
  Staked assets are bridged in through its own cross-chain connector and asset relayers.
