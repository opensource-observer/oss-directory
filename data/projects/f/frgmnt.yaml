name: frgmnt
display_name: Frgmnt
description: Frgmnt is a yield-bearing stablecoin protocol on Base. Users mint fUSD, a 1:1 USD-pegged stablecoin, and stake it into sfUSD to earn yield. The protocol allocates deposits across lending and liquidity venues through a guard-based permission system that restricts which external contracts and assets the pool can interact with.
