description: Orchard is an onchain plot game on Robinhood Chain where players plant ETH into a 5x5 field each 75-second round, with the ETH swapped for AAPL in the same transaction. Whoever planted on the plot that blooms takes the harvest from the other 24 plots, minus a rake that funds SEED stakers, a Golden Apple jackpot and the treasury.
