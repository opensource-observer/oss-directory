version: 7
name: metastreet-labs
display_name: MetaStreet
description:
  MetaStreet is a lending protocol where NFT and yield-bearing collateral is deposited
  into permissionless pools that price loans across discrete interest rate tiers.
  Pools are deployed from a factory and defaulted collateral is sold through an English
  auction liquidator.
