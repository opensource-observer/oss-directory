version: 7
name: mrdn-finance
display_name: Meridian
description: Meridian is an x402 payments protocol that lets users send tokens to any address without paying gas. A facilitator applies a signed EIP-2612 permit on the user's behalf and pays the gas, so transfers settle onchain without the sender holding the native token. MRDN is bridged between networks as a LayerZero omnichain fungible token.
