name: meridian-xyz
display_name: Meridian
description: Meridian is a derivatives venue built on Robinhood Chain, combining prediction markets settled in USDe with RWA-focused perpetuals. Predictions are matched through an RFQ auction system in which market makers compete to take the other side of each trade at the best available odds, while collateral, settlement and payouts are handled onchain by smart contracts.
