version: 7
name: unlloo
display_name: Unlloo
description: Unlloo is a peer-to-peer lending protocol on Ethereum for stablecoin loans with no collateral. A borrower posts a request, lenders choose who they fund and name their own rate, and a smart contract holds the money and splits every repayment between the lenders. Each wallet has a 0 to 1000 on-chain reputation score, built from independent services such as growthepie, and from its wallet history. Live on Ethereum mainnet.
