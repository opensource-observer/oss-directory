description: USDX is a USD stablecoin whose issuer reports reserves held in Treasury bills, bank cash and government money market funds and publishes reserve snapshots on-chain through USDXReserveOracle contracts. It lists 11 EVM networks, including Ethereum, Arbitrum, Base, Optimism, Polygon, BNB Chain, Celo, Avalanche, Scroll, Linea and Unichain.
