version: 7
name: cleave-protocol
display_name: Cleave
description:
  Cleave is a DEX aggregator on Ethereum, Optimism, BNB Chain, Polygon, Base and Arbitrum with split routing across
  pools and paths and one-step swaps between chains, with Cleave's own fees included in the quoted price. AI agents
  use the same quotes through its API and MCP server.
