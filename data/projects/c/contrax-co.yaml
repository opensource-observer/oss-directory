version: 7
name: contrax-co
display_name: Contrax Finance
description:
  Contrax Finance is a yield aggregator offering one-click deposits into auto-compounding
  vaults on Arbitrum and Base.
  Each vault pairs a strategy contract with a zapper that converts a user's input asset
  into the underlying LP position in a single transaction.
