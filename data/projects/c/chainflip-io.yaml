version: 7
name: chainflip-io
display_name: Chainflip
description: Chainflip is a decentralized cross-chain exchange for swapping native assets between Bitcoin, Ethereum, Solana, Arbitrum, BNB Chain, TRON and Polkadot without wrapped tokens or bridges. It runs its own proof-of-stake validator network that holds funds through a multi-party computation (MPC) system, uses the FLIP token for staking and fee burns, and also offers liquidity provision and over-collateralized lending.
