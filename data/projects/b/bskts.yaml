description: bskts (bskts.xyz) is an index-basket exchange on Robinhood Chain (an Arbitrum-based L2). Each basket is one token backed 1:1 by Stock Tokens and crypto held in an on-chain vault, bought and sold at net asset value and priced from on-chain Uniswap pools. It also offers Weekend Cover, protection against a Monday price gap bought from underwriters, and basket perps on Hyperliquid.
