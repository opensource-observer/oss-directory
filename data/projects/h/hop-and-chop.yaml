version: 7
name: hop-and-chop
display_name: Hop & Chop
description: Hop & Chop (hopandchop.xyz) is an on-chain survival game on MegaETH built around a 10,000-supply ERC-721 rabbit collection (symbol "Rabbit"), which minted out as blind packs paid in MegaUSD (USDM). Each rabbit owes a daily tax that escalates over the season; non-compliant rabbits can be audited by any other player and "chopped" if they fail to settle within 24 hours. All fees accumulate in an on-chain treasury that pays out when only 1% of rabbits remain alive - 95% split among survivors and 5% as a lottery to insured rabbits.
