description: InsightX is an AI-native prediction market on Mantle where forecasts on crypto, macro, sports and real-world events trade as binary outcome shares. Orders are matched off-chain in a central order book and each one is confirmed on-chain by calling the trading contract with a backend-issued signature, so every position has a verifiable onchain record.
