description: atomiq is a Bitcoin-centric trustless cross-chain protocol combining BTC light clients with atomic swaps, enabling fully non-custodial swaps between Bitcoin (on-chain and Lightning) and other chains with no intermediaries. Its contracts are deployed on Starknet, Solana, Citrea, Alpen and GOAT Network.
