version: 7
name: ampleforth
display_name: Ampleforth
description: >-
  Ampleforth is a decentralized protocol built around AMPL, a rebasing unit of
  account that targets the CPI-adjusted dollar. The ecosystem also includes
  FORTH (DAO governance) and SPOT (a perpetual note collateralized by AMPL
  derivatives).
