version: 7
name: auralan-yellownest
display_name: AuraLAN
description: >-
  A local-first, self-hosted LAN inventory and network monitoring console
  for Linux and Raspberry Pi. AuraLAN combines local network evidence into
  human-readable device identity, activity history, network baseline,
  service exposure snapshots and Home Assistant integration without
  requiring a cloud account or telemetry.
