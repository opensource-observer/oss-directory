description: Provable Games is a Starknet game studio building fully onchain games with the Dojo engine ("using cryptography to create incorruptible and indestructible fun"). This project covers the studio's shared, cross-game infrastructure — the Denshokan embeddable game collection and the MinigameToken standard, the PG World Dojo world, and the token event relayer — as distinct from its individual games, which are registered separately (lootsurvivor-provable-games, dark-shuffle-provable-games, summit-provable-games, budokan-provable-games).
