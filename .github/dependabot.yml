version: 2

# This repo is mostly curated YAML; the npm and pip dependencies exist only to
# run the validation CLI. Routine version bumps aren't worth a PR each, so
# they're off — but security fixes still come through, batched into one PR per
# ecosystem rather than one per advisory.
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # 0 disables routine version updates. Security updates are exempt from this
    # limit and are unaffected.
    open-pull-requests-limit: 0
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      pip-security:
        applies-to: security-updates
        patterns:
          - "*"

  # Actions are the exception: there are only a handful, and a version update is
  # the only way they get refreshed. One grouped PR a month.
  #
  # "/" covers .github/workflows/*.yml and a root action.yml, but NOT composite
  # actions nested in subdirectories — those have to be listed explicitly, or
  # they silently never get updated (which is how they drifted to v4 while the
  # workflows moved on).
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/workflows/setup-external-pr-tools"
      - "/.github/workflows/validate"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
